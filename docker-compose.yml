services:
  postgres:
    image: postgres:17-alpine
    container_name: trio-sabores-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: trio
      POSTGRES_PASSWORD: trio
      POSTGRES_DB: trio_sabores
    ports:
      - "5432:5432"
    volumes:
      - trio_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trio -d trio_sabores"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  trio_postgres:
